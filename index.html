<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>Lecteur YouTube</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .message {
      box-sizing: border-box;
      display: flex;
      width: 100%;
      height: 100%;
      padding: 30px;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="player"></div>

  <script>
    "use strict";

    const BRIDGE_CHANNEL = "focus-hub-youtube";
    const params = new URLSearchParams(window.location.search);
    const rawPlaylistId = params.get("playlist") || "";
    const rawVideoId = params.get("video") || "";
    const playlistIdPattern = /^[A-Za-z0-9_-]{6,120}$/;
    const videoIdPattern = /^[A-Za-z0-9_-]{11}$/;
    let playlistId = playlistIdPattern.test(rawPlaylistId) ? rawPlaylistId : "";
    let videoId = videoIdPattern.test(rawVideoId) ? rawVideoId : "";
    let mediaType = playlistId ? "playlist" : (videoId ? "video" : "");
    const initialPlaylistIndex = Math.max(0, Number.parseInt(params.get("index") || "0", 10) || 0);
    const playerContainer = document.getElementById("player");
    let presentationMode = params.get("presentation") === "background" ? "background" : "mini";

    let player = null;
    let playerReady = false;
    let playerGeneration = 0;
    let loopEnabled = false;
    let shuffleEnabled = false;
    let playbackIntent = false;
    let playlistPosition = initialPlaylistIndex;
    let parentOrigin = "*";
    let lastVolumeSignature = "";
    let playerResizeFrame = 0;
    let lastPlayerSize = "";
    let playlistEndedTimer = 0;
    let playlistEndedRecoveryTimer = 0;
    let playlistEndedSequence = 0;
    let playlistModesPending = false;
    let playlistNavigationPending = 0;
    let playlistNavigationTimer = 0;
    let playlistNavigationSequence = 0;
    let activePlaylistNavigation = null;
    let playbackIntentPauseTimer = 0;
    let playbackIntentProtectedUntil = 0;
    let playbackPausedWhileHidden = false;
    let canonicalPlaylistIds = [];
    const pendingCommands = [];

    try {
      const referrerOrigin = document.referrer ? new URL(document.referrer).origin : "";
      if (/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(referrerOrigin)) {
        parentOrigin = referrerOrigin;
      }
    } catch {
      parentOrigin = "*";
    }

    function postBridgeEvent(event, data = {}) {
      if (window.parent === window) return;
      window.parent.postMessage({
        channel: BRIDGE_CHANNEL,
        kind: "event",
        event,
        mediaType,
        videoId,
        playlistId,
        data,
      }, parentOrigin);
    }

    function getCurrentVideoId() {
      const videoDataId = String(player?.getVideoData?.()?.video_id || "");
      if (videoIdPattern.test(videoDataId)) return videoDataId;
      try {
        const playerUrl = new URL(String(player?.getVideoUrl?.() || ""));
        const urlId = String(playerUrl.searchParams.get("v") || "");
        return videoIdPattern.test(urlId) ? urlId : "";
      } catch {
        return "";
      }
    }

    function getPlayerSnapshot() {
      if (!playerReady || !player) return {};
      const videoData = player.getVideoData?.() || {};
      const playlist = player.getPlaylist?.();
      const reportedPlaylistIndex = Number(player.getPlaylistIndex?.());
      if (Number.isFinite(reportedPlaylistIndex) && reportedPlaylistIndex >= 0) {
        playlistPosition = reportedPlaylistIndex;
      }
      const currentVideoId = getCurrentVideoId();
      const canonicalPlaylistIndex = currentVideoId
        ? canonicalPlaylistIds.indexOf(currentVideoId)
        : -1;
      return {
        state: player.getPlayerState?.(),
        shouldPlay: playbackIntent || player.getPlayerState?.() === 1 || player.getPlayerState?.() === 3,
        volume: player.getVolume?.(),
        muted: !!player.isMuted?.(),
        playlistIndex: playlistPosition,
        playlistLength: Array.isArray(playlist) ? playlist.length : 0,
        playlist: Array.isArray(playlist) ? playlist : [],
        currentVideoId,
        canonicalPlaylistIndex,
        canonicalPlaylistLength: canonicalPlaylistIds.length,
        canonicalPlaylist: [...canonicalPlaylistIds],
        currentTime: Math.max(0, Number(player.getCurrentTime?.()) || 0),
        title: videoData.title || "",
        author: videoData.author || "",
        loopEnabled,
        shuffleEnabled,
      };
    }

    function publishState(event = "state") {
      postBridgeEvent(event, getPlayerSnapshot());
    }

    function clearPlaylistEndedRecovery() {
      window.clearTimeout(playlistEndedTimer);
      window.clearTimeout(playlistEndedRecoveryTimer);
      playlistEndedTimer = 0;
      playlistEndedRecoveryTimer = 0;
      playlistEndedSequence += 1;
    }

    function setPlaybackIntent(shouldPlay, protectMs = 0) {
      window.clearTimeout(playbackIntentPauseTimer);
      playbackIntentPauseTimer = 0;
      playbackIntent = !!shouldPlay;
      playbackIntentProtectedUntil = playbackIntent && protectMs > 0
        ? Date.now() + protectMs
        : 0;
    }

    function observePausedPlaybackIntent(generation) {
      window.clearTimeout(playbackIntentPauseTimer);
      playbackIntentPauseTimer = 0;
      if (!playbackIntent || activePlaylistNavigation) return;
      if (document.hidden) {
        playbackPausedWhileHidden = true;
        return;
      }
      const remaining = Math.max(1500, playbackIntentProtectedUntil - Date.now());
      playbackIntentPauseTimer = window.setTimeout(() => {
        playbackIntentPauseTimer = 0;
        if (document.hidden) {
          playbackPausedWhileHidden = true;
          return;
        }
        if (
          generation === playerGeneration &&
          playerReady &&
          player?.getPlayerState?.() === 2 &&
          !activePlaylistNavigation
        ) playbackIntent = false;
      }, remaining + 50);
    }

    function clearPlaylistNavigation() {
      window.clearTimeout(playlistNavigationTimer);
      playlistNavigationTimer = 0;
      activePlaylistNavigation = null;
      playlistNavigationSequence += 1;
    }

    function getSafePlaylistState() {
      const playlist = player?.getPlaylist?.();
      const index = Number(player?.getPlaylistIndex?.());
      return {
        playlist: Array.isArray(playlist) ? playlist : [],
        index: Number.isFinite(index) && index >= 0 ? Math.floor(index) : Math.max(0, playlistPosition),
        videoId: getCurrentVideoId(),
      };
    }

    function markPlaylistModesPending() {
      if (mediaType === "playlist") playlistModesPending = true;
    }

    function applyPlaylistModes(force = false) {
      if (!playerReady || !player || mediaType !== "playlist") return false;
      if (!force && !playlistModesPending) return false;
      const playlist = player.getPlaylist?.();
      const state = Number(player.getPlayerState?.());
      const playlistReady = (Array.isArray(playlist) && playlist.length > 0) || state === 1 || state === 5;
      if (!playlistReady) {
        playlistModesPending = true;
        if (force) {
          player.setLoop?.(loopEnabled);
          player.setShuffle?.(shuffleEnabled);
        }
        return false;
      }
      if (!canonicalPlaylistIds.length && Array.isArray(playlist) && playlist.length) {
        canonicalPlaylistIds = playlist
          .map((id) => String(id || ""))
          .filter((id) => videoIdPattern.test(id));
      }
      playlistModesPending = false;
      player.setLoop?.(loopEnabled);
      player.setShuffle?.(shuffleEnabled);
      const pendingDirection = playlistNavigationPending;
      if (pendingDirection && Array.isArray(playlist) && playlist.length) {
        playlistNavigationPending = 0;
        const generation = playerGeneration;
        window.setTimeout(() => {
          if (generation !== playerGeneration || !playerReady || !player) return;
          startPlaylistNavigation(pendingDirection, "pending");
        }, 0);
      }
      return true;
    }

    function reloadPlaylistAt(index, autoplay = true) {
      if (!playlistId) return false;
      playlistPosition = Math.max(0, Number(index) || 0);
      markPlaylistModesPending();
      const command = {
        listType: "playlist",
        list: playlistId,
        index: playlistPosition,
        startSeconds: 0,
      };
      if (autoplay) player.loadPlaylist?.(command);
      else player.cuePlaylist?.(command);
      return true;
    }

    function playlistNavigationSucceeded(navigation, current = getSafePlaylistState()) {
      if (!navigation) return false;
      return (
        (navigation.startVideoId && current.videoId && navigation.startVideoId !== current.videoId) ||
        current.index !== navigation.startIndex
      );
    }

    function getPlaylistNavigationTarget(navigation, current) {
      const length = current.playlist.length;
      if (!length) return Math.max(0, navigation.startIndex + navigation.direction);
      if (navigation.reason === "ended" && navigation.direction > 0 && navigation.startIndex >= length - 1 && !loopEnabled) {
        return -1;
      }
      return (navigation.startIndex + navigation.direction + length) % length;
    }

    function runPlaylistNavigationAttempt(navigation) {
      if (
        !navigation ||
        navigation.sequence !== playlistNavigationSequence ||
        navigation.generation !== playerGeneration ||
        !playerReady ||
        !player ||
        mediaType !== "playlist"
      ) return;

      const current = getSafePlaylistState();
      if (playlistNavigationSucceeded(navigation, current)) {
        if (playbackIntent && ![1, 3].includes(Number(player.getPlayerState?.()))) player.playVideo?.();
        clearPlaylistNavigation();
        return;
      }

      const targetIndex = getPlaylistNavigationTarget(navigation, current);
      if (targetIndex < 0) {
        setPlaybackIntent(false);
        clearPlaylistNavigation();
        publishState("state");
        return;
      }

      navigation.attempt += 1;
      playlistPosition = targetIndex;
      if (navigation.attempt === 1) {
        if (current.playlist.length) {
          if (shuffleEnabled) {
            if (navigation.direction < 0) player.previousVideo?.();
            else player.nextVideo?.();
          } else {
            player.playVideoAt?.(targetIndex);
          }
        } else {
          playlistNavigationPending = navigation.direction;
          reloadPlaylistAt(navigation.startIndex, true);
        }
      } else if (current.playlist.length) {
        player.playVideoAt?.(targetIndex);
        player.playVideo?.();
      } else if (canonicalPlaylistIds.length) {
        const currentCanonicalIndex = navigation.startVideoId
          ? canonicalPlaylistIds.indexOf(navigation.startVideoId)
          : navigation.startIndex;
        let canonicalTarget = Math.max(0, currentCanonicalIndex + navigation.direction);
        if (shuffleEnabled && canonicalPlaylistIds.length > 1) {
          const candidates = canonicalPlaylistIds
            .map((_, index) => index)
            .filter((index) => index !== currentCanonicalIndex);
          canonicalTarget = candidates[Math.floor(Math.random() * candidates.length)];
        } else if (canonicalPlaylistIds.length) {
          canonicalTarget = (canonicalTarget + canonicalPlaylistIds.length) % canonicalPlaylistIds.length;
        }
        playlistPosition = canonicalTarget;
        markPlaylistModesPending();
        player.loadPlaylist?.(canonicalPlaylistIds, canonicalTarget, 0);
      } else {
        playlistNavigationPending = navigation.direction;
        reloadPlaylistAt(navigation.startIndex, true);
      }

      const expectedSequence = navigation.sequence;
      playlistNavigationTimer = window.setTimeout(() => {
        playlistNavigationTimer = 0;
        if (!activePlaylistNavigation || activePlaylistNavigation.sequence !== expectedSequence) return;
        const latest = getSafePlaylistState();
        if (playlistNavigationSucceeded(activePlaylistNavigation, latest)) {
          if (playbackIntent && ![1, 3].includes(Number(player.getPlayerState?.()))) player.playVideo?.();
          clearPlaylistNavigation();
          return;
        }
        if (activePlaylistNavigation.attempt < 3) {
          runPlaylistNavigationAttempt(activePlaylistNavigation);
        } else {
          clearPlaylistNavigation();
          publishState("snapshot");
        }
      }, navigation.attempt === 1 ? 950 : 1500);
    }

    function startPlaylistNavigation(direction, reason = "manual") {
      if (!playerReady || !player || mediaType !== "playlist") return false;
      clearPlaylistEndedRecovery();
      clearPlaylistNavigation();
      setPlaybackIntent(true, 5000);
      const current = getSafePlaylistState();
      const sequence = playlistNavigationSequence;
      activePlaylistNavigation = {
        sequence,
        generation: playerGeneration,
        direction: direction < 0 ? -1 : 1,
        reason,
        startIndex: current.index,
        startVideoId: current.videoId,
        attempt: 0,
      };
      runPlaylistNavigationAttempt(activePlaylistNavigation);
      return true;
    }

    function advancePlaylistAfterEnded(expectedGeneration, expectedSequence, endedState) {
      if (
        expectedGeneration !== playerGeneration ||
        expectedSequence !== playlistEndedSequence ||
        !playerReady ||
        !player ||
        mediaType !== "playlist" ||
        !playbackIntent ||
        ![-1, 0, 2, 5].includes(player.getPlayerState?.())
      ) return;

      const current = getSafePlaylistState();
      if (
        (endedState.videoId && current.videoId && endedState.videoId !== current.videoId) ||
        current.index !== endedState.index
      ) return;

      const length = current.playlist.length;
      if (length && current.index >= length - 1 && !loopEnabled) {
        playbackIntent = false;
        publishState("state");
        return;
      }

      startPlaylistNavigation(1, "ended");
    }

    function schedulePlaylistEndedRecovery(generation) {
      clearPlaylistEndedRecovery();
      if (mediaType !== "playlist" || !playbackIntent) return;
      const sequence = playlistEndedSequence;
      const endedState = getSafePlaylistState();
      playlistEndedTimer = window.setTimeout(() => {
        playlistEndedTimer = 0;
        advancePlaylistAfterEnded(generation, sequence, endedState);
      }, 850);
    }

    function resizePlayer(requestedSize = null) {
      if (!playerReady || !player?.setSize) return false;
      const requestedWidth = Number(requestedSize?.width);
      const requestedHeight = Number(requestedSize?.height);
      const width = Math.max(1, Math.round(
        Number.isFinite(requestedWidth) && requestedWidth > 0
          ? requestedWidth
          : document.documentElement.clientWidth || window.innerWidth || 1
      ));
      const height = Math.max(1, Math.round(
        Number.isFinite(requestedHeight) && requestedHeight > 0
          ? requestedHeight
          : document.documentElement.clientHeight || window.innerHeight || 1
      ));
      const signature = `${width}x${height}`;
      if (signature === lastPlayerSize) return false;
      lastPlayerSize = signature;
      player.setSize(width, height);
      return true;
    }

    function schedulePlayerResize(requestedSize = null) {
      if (playerResizeFrame) cancelAnimationFrame(playerResizeFrame);
      playerResizeFrame = requestAnimationFrame(() => {
        playerResizeFrame = 0;
        resizePlayer(requestedSize);
      });
    }

    function executeCommand(message) {
      if (!playerReady || !player) {
        pendingCommands.push(message);
        return;
      }
      const command = String(message.command || "");
      const value = message.value;
      switch (command) {
        case "loadMedia": {
          clearPlaylistEndedRecovery();
          clearPlaylistNavigation();
          playlistNavigationPending = 0;
          const nextType = value?.type === "playlist" ? "playlist" : "video";
          const nextPlaylistId = playlistIdPattern.test(String(value?.playlistId || ""))
            ? String(value.playlistId)
            : "";
          const nextVideoId = videoIdPattern.test(String(value?.videoId || ""))
            ? String(value.videoId)
            : "";
          const nextPlaylistIds = Array.isArray(value?.playlistIds)
            ? value.playlistIds.map((id) => String(id || "")).filter((id) => videoIdPattern.test(id)).slice(0, 1000)
            : [];
          const autoplay = value?.autoplay !== false;
          setPlaybackIntent(autoplay, autoplay ? 5000 : 0);
          if (nextType === "playlist" && nextPlaylistId) {
            mediaType = "playlist";
            playlistId = nextPlaylistId;
            videoId = "";
            if (typeof value?.shuffle === "boolean") shuffleEnabled = value.shuffle;
            if (typeof value?.loop === "boolean") loopEnabled = value.loop;
            playlistPosition = Math.max(0, Number(value?.index) || 0);
            canonicalPlaylistIds = [...nextPlaylistIds];
            markPlaylistModesPending();
            if (nextPlaylistIds.length) {
              playlistPosition = Math.min(playlistPosition, nextPlaylistIds.length - 1);
              if (autoplay) player.loadPlaylist?.(nextPlaylistIds, playlistPosition, 0);
              else player.cuePlaylist?.(nextPlaylistIds, playlistPosition, 0);
            } else {
              const playlistCommand = {
                listType: "playlist",
                list: playlistId,
                index: playlistPosition,
                startSeconds: 0,
              };
              if (autoplay) player.loadPlaylist?.(playlistCommand);
              else player.cuePlaylist?.(playlistCommand);
            }
          } else if (nextVideoId) {
            mediaType = "video";
            playlistModesPending = false;
            canonicalPlaylistIds = [];
            videoId = nextVideoId;
            playlistId = "";
            if (autoplay) player.loadVideoById?.(videoId);
            else player.cueVideoById?.(videoId);
          } else {
            postBridgeEvent("error", { code: 2, message: "Identifiant YouTube invalide" });
            return;
          }
          break;
        }
        case "play":
          setPlaybackIntent(true, 5000);
          player.playVideo?.();
          break;
        case "pause":
          clearPlaylistEndedRecovery();
          clearPlaylistNavigation();
          setPlaybackIntent(false);
          player.pauseVideo?.();
          break;
        case "toggle":
          setPlaybackIntent(player.getPlayerState?.() !== 1, 5000);
          if (playbackIntent) player.playVideo?.();
          else {
            clearPlaylistEndedRecovery();
            clearPlaylistNavigation();
            player.pauseVideo?.();
          }
          break;
        case "next":
          if (mediaType === "playlist") {
            startPlaylistNavigation(1, "manual");
          } else {
            setPlaybackIntent(true, 5000);
            player.nextVideo?.();
          }
          break;
        case "previous":
          if (mediaType === "playlist") {
            startPlaylistNavigation(-1, "manual");
          } else {
            setPlaybackIntent(true, 5000);
            player.previousVideo?.();
          }
          break;
        case "first": {
          clearPlaylistEndedRecovery();
          clearPlaylistNavigation();
          if (mediaType !== "playlist" || !playlistId) break;
          setPlaybackIntent(true, 5000);
          const playlist = player.getPlaylist?.();
          if (Array.isArray(playlist) && playlist.length) {
            const canonicalFirstId = canonicalPlaylistIds[0] || "";
            const runtimeFirstIndex = canonicalFirstId
              ? playlist.indexOf(canonicalFirstId)
              : 0;
            if (runtimeFirstIndex >= 0) {
              playlistPosition = runtimeFirstIndex;
              player.playVideoAt?.(runtimeFirstIndex);
            } else if (canonicalPlaylistIds.length) {
              playlistPosition = 0;
              playlistModesPending = true;
              player.loadPlaylist?.(canonicalPlaylistIds, 0, 0);
            } else {
              playlistPosition = 0;
              reloadPlaylistAt(0, true);
            }
          } else if (canonicalPlaylistIds.length) {
            playlistPosition = 0;
            playlistModesPending = true;
            player.loadPlaylist?.(canonicalPlaylistIds, 0, 0);
          } else {
            playlistPosition = 0;
            reloadPlaylistAt(0, true);
          }
          break;
        }
        case "restart":
          clearPlaylistEndedRecovery();
          clearPlaylistNavigation();
          setPlaybackIntent(true, 5000);
          player.seekTo?.(0, true);
          player.playVideo?.();
          break;
        case "setVolume":
          player.setVolume?.(Math.max(0, Math.min(100, Number(value) || 0)));
          break;
        case "setMuted":
          if (value) player.mute?.();
          else player.unMute?.();
          break;
        case "setLoop":
          loopEnabled = !!value;
          if (mediaType === "playlist") applyPlaylistModes(true);
          break;
        case "setShuffle":
          shuffleEnabled = !!value;
          if (mediaType === "playlist") applyPlaylistModes(true);
          break;
        case "setPresentationMode":
          recreatePlayerForPresentation(value === "background" ? "background" : "mini");
          return;
        case "setViewportSize":
          schedulePlayerResize(value);
          return;
        case "getState":
          publishState("snapshot");
          return;
        default:
          return;
      }
      window.setTimeout(() => publishState("snapshot"), 80);
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.channel !== BRIDGE_CHANNEL || message.kind !== "command") return;
      if (parentOrigin !== "*" && event.origin !== parentOrigin) return;
      if (parentOrigin === "*" && /^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(event.origin)) {
        parentOrigin = event.origin;
      }
      executeCommand(message);
    });

    function restorePlayerSnapshot(snapshot) {
      if (!snapshot || !player) return;
      const index = Math.max(0, Number(snapshot.playlistIndex) || 0);
      const startSeconds = Math.max(0, Number(snapshot.currentTime) || 0);
      const shouldPlay = snapshot.shouldPlay === true || snapshot.state === 1 || snapshot.state === 3;
      setPlaybackIntent(shouldPlay, shouldPlay ? 5000 : 0);
      if (mediaType === "playlist" && playlistId) {
        const snapshotCanonicalPlaylist = Array.isArray(snapshot.canonicalPlaylist)
          ? snapshot.canonicalPlaylist.filter((id) => videoIdPattern.test(String(id || "")))
          : [];
        if (snapshotCanonicalPlaylist.length) canonicalPlaylistIds = [...snapshotCanonicalPlaylist];
        const playlist = canonicalPlaylistIds.length
          ? [...canonicalPlaylistIds]
          : Array.isArray(snapshot.playlist)
          ? snapshot.playlist.filter((id) => videoIdPattern.test(String(id || "")))
          : [];
        const currentId = videoIdPattern.test(String(snapshot.currentVideoId || ""))
          ? String(snapshot.currentVideoId)
          : "";
        const restoredIndex = currentId && playlist.includes(currentId)
          ? playlist.indexOf(currentId)
          : Number(snapshot.canonicalPlaylistIndex) >= 0
            ? Math.min(Number(snapshot.canonicalPlaylistIndex), Math.max(0, playlist.length - 1))
            : Math.min(index, Math.max(0, playlist.length - 1));
        const command = playlist.length
          ? [playlist, restoredIndex, startSeconds]
          : [{ listType: "playlist", list: playlistId, index, startSeconds }];
        markPlaylistModesPending();
        if (shouldPlay) player.loadPlaylist?.(...command);
        else player.cuePlaylist?.(...command);
      } else {
        const currentId = videoIdPattern.test(String(snapshot.currentVideoId || ""))
          ? String(snapshot.currentVideoId)
          : videoId;
        if (currentId) {
          const command = { videoId: currentId, startSeconds };
          if (shouldPlay) player.loadVideoById?.(command);
          else player.cueVideoById?.(command);
        }
      }
      player.setVolume?.(Math.max(0, Math.min(100, Number(snapshot.volume) || 0)));
      if (snapshot.muted) player.mute?.();
      else player.unMute?.();
      if (mediaType === "playlist") applyPlaylistModes();
    }

    function onPlayerReady(generation, restoreSnapshot = null) {
      if (generation !== playerGeneration) return;
      playerReady = true;
      const iframe = player.getIframe?.();
      if (iframe) {
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
      }
      resizePlayer();
      restorePlayerSnapshot(restoreSnapshot);
      postBridgeEvent("ready", getPlayerSnapshot());
      while (pendingCommands.length) executeCommand(pendingCommands.shift());
    }

    function onPlayerStateChange(event, generation) {
      if (generation !== playerGeneration) return;
      const reportedPlaylistIndex = Number(player?.getPlaylistIndex?.());
      if (mediaType === "playlist" && Number.isFinite(reportedPlaylistIndex) && reportedPlaylistIndex >= 0) {
        playlistPosition = reportedPlaylistIndex;
      }
      if (event.data === 1) {
        playbackPausedWhileHidden = false;
        setPlaybackIntent(true);
      }
      if (event.data === 2) observePausedPlaybackIntent(generation);
      if (mediaType === "playlist" && (event.data === 1 || event.data === 5)) {
        applyPlaylistModes();
      }
      if (event.data === 0 && mediaType === "video" && loopEnabled) {
        setPlaybackIntent(true, 5000);
        player.seekTo?.(0, true);
        player.playVideo?.();
      }
      if (event.data === 0 && mediaType === "playlist") {
        schedulePlaylistEndedRecovery(generation);
      } else if (event.data === 1 || event.data === 3) {
        clearPlaylistEndedRecovery();
      }
      if (
        activePlaylistNavigation &&
        (event.data === 1 || event.data === 3) &&
        playlistNavigationSucceeded(activePlaylistNavigation)
      ) clearPlaylistNavigation();
      publishState("state");
    }

    function onPlayerError(event, generation) {
      if (generation !== playerGeneration) return;
      if (mediaType === "playlist" && [100, 101, 150].includes(Number(event.data))) {
        clearPlaylistNavigation();
      }
      postBridgeEvent("error", {
        ...getPlayerSnapshot(),
        code: Number(event.data) || 0,
      });
    }

    function ensurePlayerTarget() {
      if (document.getElementById("player")) return;
      const target = document.createElement("div");
      target.id = "player";
      document.body.prepend(target);
    }

    function createYoutubePlayer(restoreSnapshot = null) {
      ensurePlayerTarget();
      const generation = ++playerGeneration;
      const config = {
        width: "100%",
        height: "100%",
        playerVars: {
          playsinline: 1,
          rel: 0,
          controls: presentationMode === "background" ? 0 : 1,
          disablekb: presentationMode === "background" ? 1 : 0,
          enablejsapi: 1,
        },
        events: {
          onReady: () => onPlayerReady(generation, restoreSnapshot),
          onStateChange: (event) => onPlayerStateChange(event, generation),
          onError: (event) => onPlayerError(event, generation),
        },
      };
      if (!restoreSnapshot && mediaType === "playlist") {
        config.playerVars.listType = "playlist";
        config.playerVars.list = playlistId;
        config.playerVars.index = playlistPosition;
        if (videoId) config.videoId = videoId;
      } else if (!restoreSnapshot) {
        config.videoId = videoId;
      }
      player = new YT.Player("player", config);
    }

    function recreatePlayerForPresentation(nextMode) {
      if (nextMode === presentationMode) return;
      clearPlaylistEndedRecovery();
      clearPlaylistNavigation();
      const snapshot = getPlayerSnapshot();
      presentationMode = nextMode;
      playerReady = false;
      const previousPlayer = player;
      player = null;
      ++playerGeneration;
      try {
        previousPlayer?.destroy?.();
      } catch {
        // Le nouveau lecteur remplacera proprement toute ancienne iframe restante.
      }
      ensurePlayerTarget();
      createYoutubePlayer(snapshot);
    }

    window.onYouTubeIframeAPIReady = function () {
      createYoutubePlayer();
    };

    window.addEventListener("resize", () => schedulePlayerResize());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !playbackPausedWhileHidden) return;
      playbackPausedWhileHidden = false;
      if (
        playbackIntent &&
        playerReady &&
        player &&
        mediaType === "playlist" &&
        player.getPlayerState?.() === 2
      ) {
        setPlaybackIntent(true, 5000);
        player.playVideo?.();
      }
    });
    window.visualViewport?.addEventListener("resize", () => schedulePlayerResize());
    if (typeof ResizeObserver === "function") {
      const resizeObserver = new ResizeObserver(() => schedulePlayerResize());
      resizeObserver.observe(document.documentElement);
    }

    if (!mediaType) {
      playerContainer.innerHTML = '<div class="message">Aucune vidéo ou playlist valide n’a été fournie.</div>';
      postBridgeEvent("error", { code: 2, message: "Identifiant YouTube invalide" });
    } else {
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.referrerPolicy = "strict-origin-when-cross-origin";
      script.onerror = () => postBridgeEvent("error", { code: 5, message: "API YouTube inaccessible" });
      document.head.appendChild(script);
      window.setInterval(() => {
        if (!playerReady || !player) return;
        const signature = `${player.getVolume?.()}-${!!player.isMuted?.()}`;
        if (signature === lastVolumeSignature) return;
        lastVolumeSignature = signature;
        publishState("volume");
      }, 500);
    }
  </script>
</body>
</html>
